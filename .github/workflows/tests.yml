name: Regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_dashboard_connection.cjs tests/test_dashboard_editors.cjs tests/test_dashboard_gem_stats.cjs tests/test_dashboard_notices.cjs tests/test_dashboard_status.cjs tests/test_dashboard_escaping.cjs
